name: Lint and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Lint code
        run: |
          scripts/lint
          scripts/typecheck

      - name: Run tests
        run: |
          scripts/test

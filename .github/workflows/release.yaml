name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}

    steps:
      # hatch-vcs reads the version from the tag history, so the full history
      # is required for the build to produce the tagged version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: scripts/test
      - run: uv build
      # Artifact filenames use the PEP 440 form of the version, which can differ
      # from the tag: v0.3.1-rc.0 builds as 0.3.1rc0.
      - name: Resolve the artifact version from the tag
        id: version
        run: |
          uv run --frozen --with packaging python - <<'PY' >> "$GITHUB_OUTPUT"
          import os

          from packaging.version import Version

          version = Version(os.environ["TAG"])
          print(f"version={version}")
          print(f"prerelease={str(version.is_prerelease).lower()}")
          PY
      - name: Check the artifact version matches the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ls "dist/batch_event_job_monitor-${VERSION}.tar.gz" "dist/batch_event_job_monitor-${VERSION}-py3-none-any.whl"
      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes --prerelease="$PRERELEASE"
          fi
